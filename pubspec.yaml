name: sepette_hizmet
description: "Sepette Hizmet - Hizmet pazaryeri"
publish_to: 'none'
# version: <sürüm adı>+<versionCode>
# versionCode Play'de BENZERSİZ olmalı — aynı sayı ikinci kez yüklenemez.
# Her Play yüklemesinde (kapalı test dâhil) +1 artır.
version: 1.1.0+4

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase (backend — mock'tan geçiş için; lib/core/config/backend_config.dart)
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0
  # Push bildirimleri (yeni sohbet mesajı → alıcının cihazına).
  firebase_messaging: ^15.1.6
  # Merkezi hata/çökme raporlama (canlıdaki hatalar arka planda kaydedilir).
  firebase_crashlytics: ^4.1.3
  # Callable Cloud Functions (hesap silme: deleteAccount).
  cloud_functions: ^5.2.0

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Utilities
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

  # Medya
  image_picker: ^1.1.2
  google_sign_in: ^7.2.0
  # Uzak görselleri diske önbelleğe alır (Storage bant genişliği/fatura):
  # aynı foto her kaydırmada yeniden inmez.
  cached_network_image: ^3.4.1
  firebase_app_check: ^0.3.2+10
  shared_preferences: ^2.5.5

  # Push bildirim kanalı (Android high_importance_channel). NOT: bu paket
  # başlangıçta Takip Merkezi için eklenmişti; o modül kaldırıldı ama
  # `push_service._ensureAndroidPushChannel` hâlâ kullanıyor.
  flutter_local_notifications: ^22.0.1
  firebase_analytics: ^11.6.0
  in_app_purchase: ^3.3.0
  connectivity_plus: ^7.3.0
  url_launcher: ^6.3.2
  image_cropper: ^12.2.1
  # NOT: "Usta Çantası" araç seti 2026-08-07'de üründen kaldırıldı. Onunla
  # birlikte şu bağımlılıklar da silindi (başka kullanıcıları yoktu):
  #   ar_flutter_plugin_plus · vector_math · share_plus · pdf · printing
  # AR paketi Android'de Java 17 toolchain zorunluluğunun da kaynağıydı.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Uygulama simgesi: assets/brand/app_icon.png → Android/iOS/Web mipmap'leri.
  # Çalıştır: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.3

# --- Marka simgesi (pub get + dart run flutter_launcher_icons) ---
flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: assets/brand/app_icon.png
  # Adaptive: turuncu zemin + logo (kırpılmış, dolu kare).
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/brand/app_icon.png
    # Bir tık nefes: 24 (logo daha dengeli görünsün).
  adaptive_icon_foreground_inset: 24
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    # KLASÖR DEĞİL TEK DOSYA (2026-08-19): `assets/brand/` yazılınca
    # `app_icon.png` de pakete giriyordu. O dosya yalnız BUILD ZAMANI
    # `flutter_launcher_icons` için gerekli (mipmap üretir); uygulama
    # çalışırken okunmaz. Klasörü toptan eklemek indirilen APK'ya
    # ~1.4 MB ölü yük bindiriyordu.
    - assets/brand/logo.png
    # Ekran görüntüsü çekmek için demo görselleri gerektiğinde şu üç satır
    # GEÇİCİ olarak açılır, çekim biter bitmez tekrar kapatılır (yoksa ~34 MB
    # demo fotoğraf yayın paketine girer). Muhafız: test/yayin_hazirlik_test.dart
    #   - assets/demo/avatar/
    #   - assets/demo/work/
    #   - assets/demo/product/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
